<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Друзья и чат</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='bold' text-anchor='middle' fill='white'%3EPy%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { display: block; }
    .wrap2 { max-width: 1040px; margin: 0 auto; }
    .cols { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
    .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 8px; cursor: pointer; }
    .item:hover { border-color: var(--primary); background: #eff6ff; }
    .item.sel { border-color: var(--primary); background: #eff6ff; }
    .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; flex: 0 0 34px; }
    .item .meta { flex: 1; min-width: 0; }
    .item .meta b { display: block; font-size: 14px; }
    .item .meta span { font-size: 12px; color: var(--muted); }
    .mini { padding: 6px 10px; font-size: 13px; }
    .chat-box { height: 360px; overflow-y: auto; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 14px; }
    .msg.me { align-self: flex-end; background: var(--primary); color: #fff; }
    .msg.you { align-self: flex-start; background: #e2e8f0; }
    .send { display: flex; gap: 8px; margin-top: 10px; }
    .send input { flex: 1; }
    .tag { font-size: 12px; color: var(--muted); }
    @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap2">
    <div class="brand">
      <div class="logo">Py</div>
      <div>
        <h1>Друзья и чат</h1>
        <p>Заявки, друзья, личные сообщения и приглашения</p>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-btn" href="/">Главная</a>
      <a class="nav-btn" href="/quiz">Тест</a>
      <a class="nav-btn" href="/game">Подземелье</a>
      <a class="nav-btn" href="/study">Самоподготовка</a>
      <a class="nav-btn" id="nav-friends" href="/friends">Друзья</a>
      <a class="nav-btn" id="nav-profile" href="/profile" style="display:none">Профиль</a>
      <a class="nav-btn" id="nav-teacher" href="/results" style="display:none">Панель учителя</a>
    </nav>

    <section class="card" id="login-card" style="display:none">
      <h2>Нужен вход</h2>
      <p class="lead">Войдите с главной страницы, чтобы пользоваться друзьями.</p>
      <a class="btn" href="/">На главную</a>
    </section>

    <div class="cols hidden" id="main">
      <aside>
        <section class="card">
          <h2 style="margin-top:0">Поиск</h2>
          <div class="send">
            <input type="text" id="q" placeholder="Имя пользователя" />
            <button class="btn mini" id="search-btn">Найти</button>
          </div>
          <div id="search-results" style="margin-top:10px"></div>
        </section>

        <section class="card">
          <h2 style="margin-top:0">Заявки</h2>
          <div id="requests"></div>
        </section>

        <section class="card">
          <h2 style="margin-top:0">Друзья</h2>
          <div id="friends"></div>
        </section>

        <section class="card">
          <h2 style="margin-top:0">Приглашения</h2>
          <div id="invites"></div>
        </section>
      </aside>

      <main>
        <section class="card">
          <h2 style="margin-top:0" id="chat-title">Чат</h2>
          <p class="lead" id="chat-hint">Выберите друга слева.</p>
          <div class="chat-box hidden" id="chat-box"></div>
          <div class="send hidden" id="send-row">
            <input type="text" id="msg-input" placeholder="Сообщение..." maxlength="1000" />
            <button class="btn" id="send-btn">Отправить</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/static/profile.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    let TOKEN = null, MYNAME = null, chatWith = null, lastId = 0;
    function post(u, d) {
      d = Object.assign({ token: TOKEN }, d || {});
      return fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) }).then(r => r.json());
    }
    function get(u, q) { return fetch(u + "?" + new URLSearchParams(Object.assign({ token: TOKEN }, q || {}))).then(r => r.json()); }
    function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
    function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2000);}
    function ava(u){return "<span class='dot' style='background:"+(u.avatar||"#2563eb")+"'>"+esc((u.name||"?")[0].toUpperCase())+"</span>";}

    function loadFriends() {
      return get("/api/friends").then((r) => {
        if (!r.ok) return;
        const fr = document.getElementById("friends");
        fr.innerHTML = r.friends.map(u => "<div class='item' data-chat='"+esc(u.key)+"'>"+ava(u)+"<span class='meta'><b>"+esc(u.name)+"</b><span>"+esc(u.about||"")+"</span></span></div>").join("") || "<p class='tag'>Пока нет друзей.</p>";
        fr.querySelectorAll("[data-chat]").forEach(el => el.addEventListener("click", () => openChat(el.dataset.chat)));
        const rq = document.getElementById("requests");
        let html = "";
        (r.incoming||[]).forEach(u => { html += "<div class='item'>"+ava(u)+"<span class='meta'><b>"+esc(u.name)+"</b><span>хочет в друзья</span></span><button class='btn mini' data-acc='"+esc(u.key)+"'>Принять</button></div>"; });
        (r.outgoing||[]).forEach(u => { html += "<div class='item'>"+ava(u)+"<span class='meta'><b>"+esc(u.name)+"</b><span>заявка отправлена</span></span></div>"; });
        rq.innerHTML = html || "<p class='tag'>Нет заявок.</p>";
        rq.querySelectorAll("[data-acc]").forEach(b => b.addEventListener("click", () => post("/api/friends/accept",{from:b.dataset.acc}).then(loadFriends)));
      });
    }

    function loadInvites() {
      return get("/api/invites").then(r => {
        const box = document.getElementById("invites");
        if (!r.ok) return;
        box.innerHTML = (r.invites||[]).map(v => "<div class='item'><span class='meta'><b>"+esc(v.from)+"</b><span>"+esc(v.kind)+"</span></span><button class='btn ghost mini' data-clear='"+v.id+"'>Скрыть</button></div>").join("") || "<p class='tag'>Нет приглашений.</p>";
        box.querySelectorAll("[data-clear]").forEach(b => b.addEventListener("click", () => post("/api/invites/clear",{id:Number(b.dataset.clear)}).then(loadInvites)));
      });
    }

    function openChat(key) {
      chatWith = key; lastId = 0;
      document.querySelectorAll("#friends .item").forEach(el => el.classList.toggle("sel", el.dataset.chat === key));
      const box = document.getElementById("chat-box");
      box.classList.remove("hidden");
      document.getElementById("send-row").classList.remove("hidden");
      document.getElementById("chat-hint").classList.add("hidden");
      document.getElementById("chat-title").textContent = "Чат";
      box.innerHTML = "";
      pollMessages(true);
    }

    function addMessages(msgs) {
      const box = document.getElementById("chat-box");
      msgs.forEach(m => {
        if (m.id > lastId) lastId = m.id;
        const me = m.frm === MYNAME;
        const d = document.createElement("div");
        d.className = "msg " + (me ? "me" : "you");
        d.textContent = m.body;
        box.appendChild(d);
      });
      if (msgs.length) box.scrollTop = box.scrollHeight;
    }

    function pollMessages(reset) {
      if (!chatWith) return;
      if (reset) lastId = 0;
      get("/api/messages", { with: chatWith, since: lastId }).then(r => { if (r.ok) addMessages(r.messages || []); });
    }

    function send() {
      const inp = document.getElementById("msg-input");
      const body = inp.value.trim();
      if (!body || !chatWith) return;
      post("/api/messages", { to: chatWith, body: body }).then(r => { if (r.ok) { inp.value = ""; pollMessages(); } });
    }

    function doSearch() {
      const q = document.getElementById("q").value.trim();
      get("/api/users", { q: q }).then(r => {
        const box = document.getElementById("search-results");
        if (!r.ok) return;
        box.innerHTML = (r.users||[]).map(u => "<div class='item'>"+ava(u)+"<span class='meta'><b>"+esc(u.name)+"</b><span>"+esc(u.about||"")+"</span></span><button class='btn mini' data-add='"+esc(u.key)+"'>Добавить</button></div>").join("") || "<p class='tag'>Никого не найдено.</p>";
        box.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => post("/api/friends/request",{to:b.dataset.add}).then(() => { toast("Заявка отправлена"); loadFriends(); })));
      });
    }

    document.getElementById("search-btn").addEventListener("click", doSearch);
    document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
    document.getElementById("send-btn").addEventListener("click", send);
    document.getElementById("msg-input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

    (function init() {
      const u = currentUser();
      if (!u || !u.token) { document.getElementById("login-card").style.display = ""; return; }
      TOKEN = u.token; MYNAME = u.name;
      document.getElementById("main").classList.remove("hidden");
      loadFriends(); loadInvites();
      setInterval(() => { loadFriends(); loadInvites(); }, 5000);
      setInterval(pollMessages, 3000);
    })();
  </script>
</body>
</html>
